name: Build ZN M2 Firmware

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_BRANCH: zn-m2
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REPO_BRANCH }}

      - name: Apply custom config
        run: |
          cp config/zn-m2.config .config
          echo "" >> .config
          echo "# LAN IP configuration" >> .config
          echo 'CONFIG_DEFAULT_MODEM="192.168.12.1"' >> .config
          echo 'CONFIG_DEFAULT_ipaddr="192.168.12.1"' >> .config
          make defconfig

      - name: Build firmware
        run: |
          make -j$(nproc) V=s || make -j1 V=s
        continue-on-error: false

      - name: Check build output
        run: |
          echo "=== Checking build output ==="
          find bin -name "*.img.gz" -o -name "*.ubi" -o -name "*.bin" 2>/dev/null | head -20
          echo "=== Build output end ==="

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zn-m2-firmware
          path: |
            bin/targets/qualcommax/ipq60xx/*.img.gz
            bin/targets/qualcommax/ipq60xx/*.ubi
            bin/targets/qualcommax/ipq60xx/*.bin
          retention-days: 30
          if-no-files-found: error

      - name: Upload release
        if: env.UPLOAD_RELEASE == 'true' && success()
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: zn-m2-build-${{ github.run_number }}
          name: ZN M2 Build ${{ github.run_number }}
          files: |
            bin/targets/qualcommax/ipq60xx/*.img.gz
            bin/targets/qualcommax/ipq60xx/*.ubi
            bin/targets/qualcommax/ipq60xx/*.bin
          fail_on_unmatched_files: true
