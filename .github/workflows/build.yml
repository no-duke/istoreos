name: Build ZN M2 Firmware

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_BRANCH: istoreos-24.10
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout istoreos
        uses: actions/checkout@v4
        with:
          repository: istoreos/istoreos
          ref: ${{ env.REPO_BRANCH }}
          path: openwrt

      - name: Setup build environment
        run: |
          cd openwrt
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf libelf-dev libncurses5-dev libssl-dev libz-dev msmtp p7zip-full patch python3 python2.7 rsync subversion texinfo uglifyjs unzip wget zlib1g-dev

      - name: Install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply config with EasyTier and 192.168.12.x
        run: |
          cd openwrt
          cat > .config << 'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_zn_m2=y
          CONFIG_TARGET_BOARD="zn_m2"
          CONFIG_TARGET_SUBTARGET="ipq60xx"
          CONFIG_DEFAULT_MODEM="192.168.12.1"
          CONFIG_DEFAULT_ipaddr="192.168.12.1"
          CONFIG_PACKAGE_easytier=y
          CONFIG_PACKAGE_luci-app-easytier=y
          CONFIG_PACKAGE_zerotier=y
          CONFIG_PACKAGE_luci-app-zerotier=y
          CONFIG_PACKAGE_mihomo=y
          CONFIG_PACKAGE_luci-app-istorex=y
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_kmod-docker=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y
          CONFIG_PACKAGE_nlbwmon=y
          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          EOF
          make defconfig

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: zn-m2-firmware
          path: openwrt/bin/targets/qualcommax/ipq60xx/*zn_m2*
          retention-days: 30

      - name: Upload release
        if: env.UPLOAD_RELEASE == 'true'
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: zn-m2-build-${{ github.run_number }}
          name: ZN M2 Build ${{ github.run_number }}
          files: openwrt/bin/targets/qualcommax/ipq60xx/*zn_m2*
