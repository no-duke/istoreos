name: Build ZN M2 Firmware

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_BRANCH: openwrt-24.10
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REPO_BRANCH }}

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply custom config for ZN-M2
        run: |
          cat > .config << 'EOF'
          CONFIG_TARGET_ipq806x_generic=y
          CONFIG_TARGET_ipq806x_generic_DEVICE_zyxel_qax61s=y
          CONFIG_PACKAGE_easytier=y
          CONFIG_PACKAGE_luci-app-easytier=y
          CONFIG_TARGET_DEFAULT_MODEM="192.168.12.1"
          CONFIG_TARGET_ipaddr="192.168.12.1"
          CONFIG_PACKAGE_zerotier=y
          CONFIG_PACKAGE_luci-app-zerotier=y
          CONFIG_PACKAGE_mihomo=y
          CONFIG_PACKAGE_luci-app-istorex=y
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          EOF
          make defconfig

      - name: Build firmware
        run: |
          make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: zn-m2-firmware
          path: bin/targets/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload release
        if: env.UPLOAD_RELEASE == 'true'
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: zn-m2-build-${{ github.run_number }}
          name: ZN M2 Build ${{ github.run_number }}
          files: bin/targets/**/*
          fail_on_unmatched_files: true
