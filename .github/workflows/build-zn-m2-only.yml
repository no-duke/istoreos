name: Build ZN-M2 Firmware

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_BRANCH: zn-m2
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REPO_BRANCH }}

      - name: Apply custom config
        run: |
          cp config/zn-m2.config .config
          echo "" >> .config
          echo 'CONFIG_DEFAULT_MODEM="192.168.12.1"' >> .config
          echo 'CONFIG_DEFAULT_ipaddr="192.168.12.1"' >> .config
          make defconfig

      - name: Build firmware
        run: |
          make -j$(nproc) V=s || make -j1 V=s

      - name: Check build output
        if: always()
        run: |
          echo "=== Checking build output ==="
          find bin -name "*.img.gz" -o -name "*.ubi" -o -name "*.bin" 2>/dev/null | head -20
          echo "=== Build output end ==="

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zn-m2-firmware
          path: bin/targets/qualcommax/ipq60xx/
          retention-days: 30
          if-no-files-found: warn
