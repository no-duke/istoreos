name: Build ZN-M2 (ImmortalWrt v25.12.1)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_TAG: v25.12.1
  CONFIG_FILE: zn-m2.config
  DIY_SH1: diy-part1.sh
  DIY_SH2: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build ZN-M2 Firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show build info
        run: |
          echo "============================================"
          echo " ZN-M2 ImmortalWrt Firmware Build"
          echo "============================================"
          echo " Source: ImmortalWrt ${{ env.REPO_TAG }}"
          echo " Kernel: 6.12"
          echo " WiFi:   DISABLED"
          echo " LAN IP: 192.168.12.1"
          echo " Date:   $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "============================================"

      - name: Free disk space
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost /usr/lib/jvm /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          sudo apt-get autoremove -y --purge
          df -h /

      - name: Setup build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev \
            wget curl time coreutils quilt perl python3-pip
          sudo apt-get clean

      - name: Create swap file
        run: |
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=8192
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Clone source code
        run: |
          echo "Cloning ImmortalWrt $REPO_TAG..."
          git clone --depth 1 --single-branch -b "$REPO_TAG" "$REPO_URL" openwrt
          cd openwrt
          echo "=== Git info ==="
          git log -1 --format="%H %ci %s"
          echo ""
          echo "=== Kernel version ==="
          grep -r "KERNEL_PATCHVER" target/linux/qualcommax/Makefile 2>/dev/null || true
          echo ""
          echo "=== Existing IPQ60xx devices ==="
          grep "TARGET_DEVICES +=" target/linux/qualcommax/image/ipq60xx.mk 2>/dev/null || true

      - name: Cache toolchain and dl
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir
            openwrt/build_dir/host
          key: ${{ runner.os }}-zn-m2-v2512-${{ hashFiles('configs/zn-m2.config') }}
          restore-keys: |
            ${{ runner.os }}-zn-m2-v2512-

      - name: Run DIY script (part 1)
        run: |
          cd openwrt
          chmod +x ../scripts/${{ env.DIY_SH1 }}
          ../scripts/${{ env.DIY_SH1 }}

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Run DIY script (part 2)
        run: |
          cd openwrt
          chmod +x ../scripts/${{ env.DIY_SH2 }}
          ../scripts/${{ env.DIY_SH2 }}

      - name: Apply custom config
        run: |
          cd openwrt
          # Copy files from files/ directory
          cp -r ../files/* . 2>/dev/null || true
          # Copy patches
          cp -r ../scripts/patches/* . 2>/dev/null || true
          # Apply config
          cp ../configs/${{ env.CONFIG_FILE }} .config
          make defconfig

          echo "=== Key config items ==="
          grep -E "TARGET_qualcommax|TARGET.*DEVICE.*zn_m2|LINUX" .config || true

          echo "=== Verify target device ==="
          if grep -q "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_zn_m2=y" .config; then
            echo "OK: ZN-M2 device selected correctly!"
          else
            echo "ERROR: ZN-M2 device NOT selected!"
            grep "CONFIG_TARGET.*DEVICE.*=y" .config || true
            exit 1
          fi

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc) 2>&1 | tail -20 || {
            echo "Download failed, trying single thread..."
            make download -j1 V=s
          }

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zn-m2-firmware
          path: openwrt/bin/targets/qualcommax/ipq60xx/*zn_m2*
          if-no-files-found: error
          retention-days: 7
