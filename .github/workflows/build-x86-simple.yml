name: Build x86 Firmware

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_BRANCH: istoreos-24.10
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REPO_BRANCH }}

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison gawk python3 ccache libncurses5-dev autoconf automake libelf-dev libgmp-dev libmpc-dev libmpfr-dev libisl-dev unzip git rsync coreutils texinfo xxd zlib1g-dev libssl-dev libtool libreadline-dev python3-pip
          pip3 install --break-system-packages pyelftools

      - name: Download Sources
        run: |
          make defconfig
          make download -j$(nproc)

      - name: Apply x86 Config
        run: |
          echo 'CONFIG_TARGET_x86=y' >> .config
          echo 'CONFIG_TARGET_x86_64=y' >> .config
          echo 'CONFIG_TARGET_x86_64_GENERIC=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-usb-storage=y' >> .config
          echo 'CONFIG_PACKAGE_luci=y' >> .config
          echo 'CONFIG_PACKAGE_luci-ssl=y' >> .config
          make defconfig

      - name: Build
        run: |
          make -j$(nproc) || make -j1

      - name: Check Output
        run: |
          find bin/targets -name "*.img.gz" 2>/dev/null | head -10

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x86-firmware
          path: bin/targets/x86/64/
          retention-days: 30
