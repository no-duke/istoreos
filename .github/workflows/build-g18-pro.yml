name: Build G18 Pro Firmware

on:
  workflow_dispatch:
    inputs:
      device:
        description: '选择设备'
        required: true
        default: 'bdy-g18-pro'
        type: choice
        options:
          - bdy-g18-pro
          - nsy-g16-plus_nsy-g68-plus_bdy-g18-pro

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  VERSION: 24.10

jobs:
  build-g18-pro:
    name: Build G18 Pro
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout iStoreOS
        uses: actions/checkout@v4
        with:
          repository: istoreos/istoreos
          ref: istoreos-24.10
          path: openwrt

      - name: Add G18 Pro device definition
        run: |
          cd openwrt
          cat >> target/linux/rockchip/image/armv8.mk << 'EOF'
define Device/bdy_g18-pro
  $(Device/u-boot-separate)
  $(Device/uefi-lp5)
  DEVICE_VENDOR := BDY
  DEVICE_MODEL := G18 Pro
  SOC := rk3568
  DEVICE_DTS := rockchip/rk3568-bdy-g18-pro
  UBOOT_DEVICE_NAME := bdy-g18-pro-rk3568
  IMAGE/sysupgrade.itb := kernel-bin | gzip | append-u-boot-rk3568-sd
  IMAGES += recovery.img
  IMAGE/recovery.img := partition Recovery | rkdevalrom
endef
TARGET_DEVICES += bdy_g18-pro
EOF

      - name: Add G18 Pro device tree
        run: |
          cd openwrt
          curl -sL "https://raw.githubusercontent.com/unifreq/linux-6.6.y/main/arch/arm64/boot/dts/rockchip/rk3568-bdy-g18-pro.dts" -o target/linux/rockchip/dts/rk3568-bdy-g18-pro.dts

      - name: Setup environment
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Configure G18 Pro
        run: |
          cd openwrt
          echo 'CONFIG_TARGET_rockchip=y' >> .config
          echo 'CONFIG_TARGET_rockchip_armv8=y' >> .config
          echo 'CONFIG_TARGET_rockchip_armv8_DEVICE_bdy_g18-pro=y' >> .config
          echo 'CONFIG_PACKAGE_luci=y' >> .config
          make defconfig

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s

      - name: Check build output
        if: always()
        run: |
          echo "=== Checking build output ==="
          find bin -name "*.itb" -o -name "*.img" -o -name "*.bin" 2>/dev/null | head -20
          echo "=== Build output end ==="

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g18-pro-firmware
          path: bin/targets/rockchip/armv8/
          retention-days: 30
          if-no-files-found: warn
