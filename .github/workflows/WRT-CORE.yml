# ============================================================
# iStoreOS Multi-Platform Build (借鉴 VIKINGYFY 架构)
# 核心编译 workflow，被其他 workflow 调用
# ============================================================

name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
        default: 'argon'
      WRT_NAME:
        required: true
        type: string
        default: 'OpenWrt'
      WRT_SSID:
        required: true
        type: string
        default: 'OpenWrt'
      WRT_WORD:
        required: true
        type: string
        default: '12345678'
      WRT_IP:
        required: true
        type: string
        default: '192.168.1.1'
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
        default: ''

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  REPO_OWNER: no-duke
  REPO_NAME: istoreos

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}-${{inputs.WRT_CONFIG}}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Projects
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.WRT_BRANCH }}

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix python3-netifaces libfuse-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/${WRT_CONFIG}.txt)" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          # 使用已 checkout 的代码（包含自定义文件），复制为 build 目录
          cp -r . ./build/
          cd ./build/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Update Feeds
        run: |
          cd ./build/
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Settings
        run: |
          cd ./build/

          # 应用配置文件
          cat ${GITHUB_WORKSPACE}/Config/${WRT_CONFIG}.txt >> .config
          cat ${GITHUB_WORKSPACE}/Config/GENERAL.txt >> .config

          # 运行自定义设置脚本
          ${GITHUB_WORKSPACE}/Scripts/Settings.sh

          make defconfig -j$(nproc)
          make clean -j$(nproc)

      - name: Download Packages
        run: |
          cd ./build/
          make download -j$(nproc)

      - name: Compile Firmware
        run: |
          cd ./build/
          make -j$(nproc) || make -j1 V=s

      - name: Package Firmware
        run: |
          cd ./build/ && mkdir -p ./upload/

          cp -f ./.config ./upload/Config-${WRT_CONFIG}-${WRT_SOURCE}-${WRT_BRANCH}-${WRT_DATE}.txt

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*${WRT_TARGET}*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "(\${WRT_TARGET}).*")
              NEW_FILE="${WRT_SOURCE}-${WRT_BRANCH}-${NAME}-${WRT_DATE}.${EXT}"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{inputs.WRT_CONFIG}}-firmware
          path: ./build/upload/
          retention-days: 30
          if-no-files-found: error

      - name: Release Firmware
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_SOURCE}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          name: ${{env.WRT_CONFIG}}-${{env.WRT_SOURCE}}-${{env.WRT_DATE}}
          files: ./build/upload/*.*
          body: |
            固件信息：
            配置：${{env.WRT_CONFIG}}
            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            登录地址：${{env.WRT_IP}}
            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}
